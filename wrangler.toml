name = "voice-chatbot"
main = "src/index.js"
compatibility_date = "2024-01-01"
account_id = "2764ae0fd9a5cb92c9ac67708620e54c"

[durable_objects]
bindings = [
  { name = "WEBSOCKET_HIBERNATION_SERVER", class_name = "WebSocketHibernationServer" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WebSocketHibernationServer"]

[ai]
binding = "AI"
remote = true

# Set to your AI Gateway name to enable MiniMax TTS for languages Cloudflare
# can't synthesize first-party (zh/ja/ko). Empty = disabled (browser TTS is used).
# Requires creating the gateway in the dashboard (AI > AI Gateway) and enabling
# partner-model billing. See CLAUDE.md.
[vars]
AI_GATEWAY_ID = ""